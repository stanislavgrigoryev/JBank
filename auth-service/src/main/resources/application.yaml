spring:
  application:
    name: auth-service

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false

  data:
    redis:
      host: localhost
      port: 6379

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_EMAIL_USERNAME:}
    password: ${SPRING_EMAIL_PASSWORD:}
    support: ${SUPPORT_EMAIL:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

security:
  jwt:
    secret-key: ${SECURITY.JWT.SECRET_KEY}
    token-expiration: ${SECURITY.JWT.TOKEN_EXPIRATION}
    refresh-token-expiration: ${SECURITY.JWT.REFRESH_TOKEN_EXPIRATION}

server:
  port: 8081

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false  # UI только на Gateway, здесь не нужен

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true