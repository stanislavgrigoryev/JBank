spring:
  application:
    name: api-gateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/auth/**, /api/v1/user/**
              filters:
                - AuthenticationFilter

            - id: account-service
              uri: http://localhost:8080
              predicates:
                - Path=/api/v1/account/**
              filters:
                - AuthenticationFilter

            - id: auth-service-docs
              uri: http://localhost:8081
              predicates:
                - Path=/auth-docs/**
              filters:
                - RewritePath=/auth-docs/(?<segment>.*), /$\{segment}

            - id: account-service-docs
              uri: http://localhost:8080
              predicates:
                - Path=/account-docs/**
              filters:
                - RewritePath=/account-docs/(?<segment>.*), /$\{segment}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: 3Xq8jK9mN2pL5rV7bY1cF4dG6hJ8kL0zXcVbNmQwErTyUiOpAsDfGhJkLzXcVbNmQwErTyUiOpAsDfGhJkLzA==A

server:
  port: 8083

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Auth Service
        url: /auth-docs/v3/api-docs
      - name: Account Service
        url: /account-docs/v3/api-docs
    urls-primary-name: Auth Service

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: DEBUG