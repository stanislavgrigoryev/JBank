services:

  discovery-service:
    build:
      context: ./discovery-service
    ports:
      - "8761:8761"
    container_name: discovery-service
    hostname: discovery-service
    healthcheck:
      test: [ "CMD-SHELL", "java -version 2>/dev/null && wget -q --spider http://discovery-service:8761/actuator/health || exit 1" ]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 20s
    restart: unless-stopped
    networks:
      jbank-network:

  auth_db:
    image: postgres:15.3-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U auth -d auth_db" ]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 20s
    networks:
      jbank-network:
    volumes:
      - auth_data:/var/lib/postgresql/data

  account_db:
    image: postgres:15.3-alpine
    environment:
      POSTGRES_DB: account_db
      POSTGRES_USER: account
      POSTGRES_PASSWORD: account
    ports:
      - "5434:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U account -d account_db" ]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    networks:
      jbank-network:
    volumes:
      - account_data:/var/lib/postgresql/data

  card_db:
    image: postgres:15.3-alpine
    environment:
      POSTGRES_DB: card_db
      POSTGRES_USER: card
      POSTGRES_PASSWORD: card
    ports:
      - "5435:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U card -d card_db" ]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    restart: unless-stopped
    networks:
      jbank-network:
    volumes:
      - card_data:/var/lib/postgresql/data

  credit_db:
    image: postgres:15.3-alpine
    environment:
      POSTGRES_DB: credit_db
      POSTGRES_USER: credit
      POSTGRES_PASSWORD: credit
    ports:
      - "5436:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U credit -d credit_db" ]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    networks:
      jbank-network:
    volumes:
      - credit_data:/var/lib/postgresql/data

  admin_db:
    image: postgres:15.3-alpine
    environment:
      POSTGRES_DB: admin_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5437:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d admin_db" ]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    restart: unless-stopped
    networks:
      jbank-network:
    volumes:
      - admin_data:/var/lib/postgresql/data

  transaction_db:
    image: postgres:15.3-alpine
    environment:
      POSTGRES_DB: transaction_db
      POSTGRES_USER: transaction
      POSTGRES_PASSWORD: transaction
    ports:
      - "5438:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U transaction -d transaction_db" ]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    restart: unless-stopped
    networks:
      jbank-network:
    volumes:
      - transaction_data:/var/lib/postgresql/data

  notification_db:
    image: postgres:15.3-alpine
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: notification
    ports:
      - "5439:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U notification -d notification_db" ]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    restart: unless-stopped
    networks:
      jbank-network:
    volumes:
      - notification_data:/var/lib/postgresql/data

  redis:
    image: redis:7.0.12-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping" ]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    restart: unless-stopped
    container_name: jbank-redis
    hostname: jbank-redis
    networks:
      jbank-network:
    volumes:
      - redis_data:/data

  auth-service:
    build:
      context: ./auth-service
    env_file:
      - ./auth-service/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth_db:5432/auth_db
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SERVER_PORT: 8080
    depends_on:
      discovery-service:
        condition: service_healthy
      auth_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8081:8080"
    restart: unless-stopped
    container_name: auth-service
    hostname: auth-service
    healthcheck:
      test: [ "CMD-SHELL", "java -version 2>/dev/null && wget -q --spider http://auth-service:8080/actuator/health || exit 1" ]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 30s
    networks:
      jbank-network:

  account-service:
    build:
      context: ./account-service
    env_file:
      - ./account-service/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://account_db:5432/account_db
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      SERVER_PORT: 8080
    ports:
      - "8082:8080"
    restart: unless-stopped
    container_name: account-service
    hostname: account-service
    depends_on:
      account_db:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "java -version 2>/dev/null && wget -q --spider http://account-service:8080/actuator/health || exit 1" ]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 30s
    networks:
      jbank-network:

  card-service:
    build:
      context: ./card-service
    env_file:
      - ./card-service/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://card_db:5432/card_db
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      SERVER_PORT: 8080
    ports:
      - "8083:8080"
    container_name: card-service
    hostname: card-service
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "java -version 2>/dev/null && wget -q --spider http://card-service:8080/actuator/health || exit 1" ]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 30s
    depends_on:
      discovery-service:
        condition: service_healthy
      card_db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      jbank-network:

  credit-service:
    build:
      context: ./credit-service
    env_file:
      - ./credit-service/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://credit_db:5432/credit_db
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      SERVER_PORT: 8080
    ports:
      - "8084:8080"
    container_name: credit-service
    hostname: credit-service
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "java -version 2>/dev/null && wget -q --spider http://credit-service:8080/actuator/health || exit 1" ]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 30s
    depends_on:
      discovery-service:
        condition: service_healthy
      credit_db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      jbank-network:

  admin-service:
    build:
      context: ./admin-service
    env_file:
      - ./admin-service/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://admin_db:5432/admin_db
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SERVER_PORT: 8080
    ports:
      - "8085:8080"
    container_name: admin-service
    hostname: admin-service
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "java -version 2>/dev/null && wget -q --spider http://admin-service:8080/actuator/health || exit 1" ]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 30s
    depends_on:
      discovery-service:
        condition: service_healthy
      admin_db:
        condition: service_healthy
    networks:
      jbank-network:

  notification-service:
    build:
      context: ./notification-service
    env_file:
      - ./notification-service/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://notification_db:5432/notification_db
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      SERVER_PORT: 8080
    ports:
      - "8088:8080"
    container_name: notification-service
    hostname: notification-service
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "java -version 2>/dev/null && wget -q --spider http://notification-service:8080/actuator/health || exit 1" ]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 30s
    depends_on:
      discovery-service:
        condition: service_healthy
      notification_db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      jbank-network:

  transaction-service:
    build:
      context: ./transaction-service
    env_file:
      - ./transaction-service/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://transaction_db:5432/transaction_db
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      SERVER_PORT: 8080
    ports:
      - "8087:8080"
    container_name: transaction-service
    hostname: transaction-service
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "java -version 2>/dev/null && wget -q --spider http://transaction-service:8080/actuator/health || exit 1" ]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 30s
    depends_on:
      discovery-service:
        condition: service_healthy
      transaction_db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      jbank-network:

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.151.0.5
    ports:
      - "8428:8428"
    container_name: victoria-metrics
    hostname: victoria-metrics
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://victoria-metrics:8428/health | grep -q OK || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      discovery-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      card-service:
        condition: service_healthy
      credit-service:
        condition: service_healthy
      account-service:
        condition: service_healthy
      admin-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      transaction-service:
        condition: service_healthy
    volumes:
      - victoriametrics_data:/victoria-metrics-data
    command:
      - "--retentionPeriod=30d"
      - "--httpListenAddr=:8428"
    restart: unless-stopped
    networks:
      jbank-network:

  vmagent:
    image: victoriametrics/vmagent:v1.152.0
    container_name: vmagent
    volumes:
      - ./vmagent-config.yml:/etc/vmagent/config.yml
    command:
      - '-promscrape.config=/etc/vmagent/config.yml'
      - "--promscrape.eurekaSDCheckInterval=30s"
      - '-remoteWrite.url=http://victoriametrics:8428/api/v1/write'
    ports:
      - "8429:8429"
    depends_on:
      discovery-service:
        condition: service_healthy
      victoriametrics:
        condition: service_healthy
    networks:
      jbank-network:

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    container_name: grafana
    hostname: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    restart: unless-stopped
    depends_on:
      victoriametrics:
        condition: service_healthy
    networks:
      jbank-network:

  api-gateway-service:
    build:
      context: ./api-gateway-service
    ports:
      - "8086:8080"
    container_name: api-gateway-service
    hostname: api-gateway-service
    restart: unless-stopped
    env_file:
      - ./api-gateway-service/.env
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SERVER_PORT: 8080
    depends_on:
      discovery-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      card-service:
        condition: service_healthy
      credit-service:
        condition: service_healthy
      account-service:
        condition: service_healthy
      admin-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      transaction-service:
        condition: service_healthy
    networks:
      jbank-network:

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9094:9094"
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9094" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9094,CONTROLLER://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      jbank-network:

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local-kraft
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9094
    networks:
      jbank-network:

  zipkin:
    image: openzipkin/zipkin:3
    container_name: zipkin
    ports:
      - "9411:9411"
    healthcheck:
      test: ["wget -q --spider http://localhost:9411/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      jbank-network:

networks:
  jbank-network:

volumes:
  auth_data:
  account_data:
  redis_data:
  card_data:
  credit_data:
  admin_data:
  victoriametrics_data:
  grafana_data:
  kafka_data:
  notification_data:
  transaction_data: